<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICU 학습앱 - V2 대분류별 문제</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .question-container { min-height: 200px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app-header" class="flex flex-wrap items-center justify-between mb-6 p-4 bg-white rounded-lg shadow">
      <div class="flex items-center gap-4">
        <span id="user-id-header" class="font-bold text-blue-700">User: guest</span>
        <span id="d-day-header" class="text-sm text-gray-500">D-30</span>
        <span id="date-header" class="text-sm text-gray-500"></span>
      </div>
      <div class="flex items-center gap-4">
        <span id="daily-progress-header" class="text-sm text-gray-500">오늘 진도: 0%</span>
        <span id="total-progress-header" class="font-bold text-blue-700">전체 진도: 0%</span>
      </div>
    </div>

    <div class="container mx-auto px-4 py-6 max-w-4xl">
        <h1 class="text-3xl font-bold text-center text-blue-700 mb-6">AICU 학습앱 - V2 (최종 수정본)</h1>

        <div id="loading-area" class="text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p id="loading-status" class="text-gray-600">ins_789_final_dev.csv 파일을 불러오는 중...</p>
            <!-- 노팀장 버전의 로딩 프로그레스 바 추가 -->
            <div class="mt-2 w-full bg-gray-200 rounded-full h-2">
                <div id="loading-progress" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="quiz-area" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <p>여기에 V2.0의 UI 요소들이 표시됩니다.</p>
                <!-- V2.0의 문제 표시 및 답안, 컨트롤 버튼 등 UI 요소들이 여기에 통합될 예정입니다. -->
            </div>
        </div>

        <script>
            // PapaParse 라이브러리가 로드되었는지 확인
            if (typeof Papa === 'undefined') {
                console.error('PapaParse 라이브러리가 로드되지 않았습니다.');
                // 로딩 오류 UI 표시 등 추가
            }

            const loadingStatus = document.getElementById('loading-status');
            const loadingProgress = document.getElementById('loading-progress'); // 로딩 프로그레스 바 요소
            let questions = []; // 전체 문제 배열
            let filteredQuestions = []; // 현재 모드에 맞는 문제 배열
            let currentQuestionIndex = 0; // 현재 문제 인덱스

            async function loadCSVData() {
                loadingStatus.textContent = "CSV 데이터 로딩 중...";
                try {
                    // 노팀장 index.html의 로딩 방식을 완전 적용 (ins_789_final_dev.csv 사용)
                    loadingStatus.textContent = "ins_789_final_dev.csv 파일 다운로드 중...";
                    loadingProgress.style.width = "10%";

                    const response = await fetch('ins_789_final_dev.csv');

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    loadingStatus.textContent = "대용량 CSV 파일 파싱 중... (잠시만 기다려 주세요)";
                    loadingProgress.style.width = "50%";

                    const csvContent = await response.text();

                    loadingStatus.textContent = "문제 데이터 처리 중...";
                    loadingProgress.style.width = "80%";

                    // PapaParse로 CSV 파싱 (노팀장 버전의 대용량 최적화 옵션 포함)
                    const parsed = Papa.parse(csvContent, {
                        header: true,
                        dynamicTyping: false,
                        skipEmptyLines: true,
                        delimiter: ',',
                        quoteChar: '"',
                        fastMode: true // 대용량 파일 최적화 옵션
                    });

                    if (parsed.errors.length > 0) {
                        console.warn('CSV 파싱 경고:', parsed.errors.slice(0, 5)); // 처음 5개만 표시
                    }

                    // 조대표님 지침에 따라 QCODE가 존재하는 행만 유효한 문제로 필터링
                    // 노팀장 버전의 필터링 조건도 함께 적용하여 안정성 확보
                    questions = parsed.data.filter(row =>
                        row.QCODE &&
                        row.QUESTION &&
                        row.ANSWER
                        // SOURCE 필터링은 필요시 추가 (ins_789_final_dev.csv가 항상 '인스교재'라면 생략)
                        // row.SOURCE === '인스교재'
                    );

                    if (questions.length === 0) {
                        loadingStatus.innerHTML = `
                            <span class="text-red-600 font-bold">문제를 불러오지 못했습니다. CSV 파일에 유효한 데이터가 없습니다.</span><br>
                            <span class="text-sm mt-2">확인 사항:</span><br>
                            <span class="text-sm">1. ins_789_final_dev.csv 파일이 비어있지 않은지</span><br>
                            <span class="text-sm">2. QCODE, QUESTION, ANSWER 필드에 값이 채워져 있는지</span>
                        `;
                        loadingProgress.style.width = "0%";
                    } else {
                        loadingStatus.textContent = `총 ${questions.length}개의 문제를 성공적으로 불러왔습니다.`;
                        loadingProgress.style.width = "100%";
                        document.getElementById('loading-area').classList.add('hidden');
                        document.getElementById('quiz-area').classList.remove('hidden');

                        // V2.0의 대분류/모드별 기능에 맞춰 filteredQuestions 설정 로직이 여기에 추가됩니다.
                        // 일단은 모든 문제를 filteredQuestions에 할당하여 기본 동작을 확인합니다.
                        filteredQuestions = questions;
                        displayQuestion(currentQuestionIndex);
                    }

                } catch (error) {
                    console.error('CSV 로딩 오류:', error);
                    loadingStatus.innerHTML = `
                        <span class="text-red-600 font-bold">CSV 로딩 실패: ${error.message}</span><br>
                        <span class="text-sm mt-2">해결 방법:</span><br>
                        <span class="text-sm">1. ins_789_final_dev.csv 파일이 같은 폴더에 있는지 확인</span><br>
                        <span class="text-sm">2. GitHub Pages에서 실행 (권장)</span><br>
                        <span class="text-sm">3. 로컬 웹서버 사용 (python -m http.server)</span>
                    `;
                    loadingProgress.style.width = "0%";
                }
            }

            window.addEventListener('load', loadCSVData);

            // 임시 UI 업데이트 함수
            function displayQuestion(index) {
                if (index < filteredQuestions.length) {
                    const question = filteredQuestions[index];
                    console.log('문제 표시:', question.QUESTION);
                    // 여기에 문제 UI 업데이트 로직이 들어갑니다.
                }
            }

            // ... (기존의 V2.0 기능들)
        </script>
    </div>
</body>
</html>
